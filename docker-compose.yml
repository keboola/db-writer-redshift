version: '3'
services:
  app: &main
    image: keboola/db-writer-redshift
    build:
        context: .
        target: app
    environment:
      - STORAGE_API_URL
      - STORAGE_API_TOKEN
      - REDSHIFT_DB_HOST
      - REDSHIFT_DB_PORT
      - REDSHIFT_DB_USER
      - REDSHIFT_DB_PASSWORD
      - REDSHIFT_DB_DATABASE
      - REDSHIFT_DB_SCHEMA
      - PHP_IDE_CONFIG=serverName=Redshift
    links:
      - sshproxy
    volumes:
      - ssh-keys:/root/.ssh

  dev:
    <<: *main
    build:
        context: .
        target: dev
    volumes:
      - .:/code
      - ./data:/data
      - ssh-keys:/root/.ssh

  sshproxy:
    image: keboola/db-component-ssh-proxy:latest
    volumes:
      - ssh-keys:/root/.ssh

volumes:
  ssh-keys: