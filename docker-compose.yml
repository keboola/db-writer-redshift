version: '3'
services:
  app: &main
    image: keboola/db-writer-redshift
    build:
        context: .
    environment:
      - STORAGE_API_URL
      - STORAGE_API_TOKEN
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_DATABASE
      - DB_SCHEMA
    links:
      - sshproxy
    volumes:
      - ssh-keys:/root/.ssh

  dev:
    <<: *main
    build:
        context: .
    volumes:
      - .:/code
      - ./data:/data
      - ssh-keys:/root/.ssh

  sshproxy:
    image: keboola/db-component-ssh-proxy:latest
    volumes:
      - ssh-keys:/root/.ssh

volumes:
  ssh-keys: